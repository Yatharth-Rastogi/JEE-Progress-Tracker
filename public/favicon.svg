<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background subtle dark gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border glow -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Core symbol gradient: Radiant Cyan to Electric Sky & Indigo -->
    <linearGradient id="sparkGrad" x1="16" y1="12" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Specular highlight -->
    <linearGradient id="specularGrad" x1="32" y1="13" x2="47" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft core bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle with subtle luxury border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="1.75"/>

  <!-- Minimalist Core: Precision Mastery Spark & Apex -->
  <g filter="url(#bloom)">
    <!-- Central diamond star: mathematically balanced 4-point zenith spark -->
    <path d="M32 13 C32.9 22.2 35.8 25.1 45 26 C35.8 26.9 32.9 29.8 32 39 C31.1 29.8 28.2 26.9 19 26 C28.2 25.1 31.1 22.2 32 13 Z" fill="url(#sparkGrad)"/>
    <!-- Specular facet for crisp glassmorphism/depth -->
    <path d="M32 13 C32.9 22.2 35.8 25.1 45 26 C39.5 26.8 33.5 21.8 32 13 Z" fill="url(#specularGrad)" opacity="0.85"/>
  </g>

  <!-- Subtle triad precision beacons -->
  <circle cx="32" cy="48" r="2.2" fill="#22d3ee"/>
  <circle cx="23" cy="48" r="1.3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="41" cy="48" r="1.3" fill="#818cf8" opacity="0.6"/>
</svg>
